<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irtiqaa Public Documents</title>
<style>
  :root {
    --bg: #0D0D0F;
    --surface: #1C1C1E;
    --primary: #6B9E6E;
    --text: #E8E8E8;
    --secondary: #8E8E93;
    --divider: #2C2C2E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "SF Pro Text", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    width: min(640px, 100%);
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: 18px;
    padding: 28px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 28px;
  }
  p {
    margin: 0 0 20px;
    color: var(--secondary);
    line-height: 1.6;
  }
  a {
    display: block;
    padding: 14px 16px;
    margin-top: 12px;
    border: 1px solid var(--divider);
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    background: rgba(255, 255, 255, 0.02);
  }
  a:hover {
    border-color: var(--primary);
    color: var(--primary);
  }
</style>
</head>
<body>
<main>
  <h1>Irtiqaa</h1>
  <p>Public legal and support documents for the Irtiqaa app.</p>
  <a href="./privacy.html">Privacy Policy</a>
  <a href="./terms.html">Terms of Use</a>
</main>
</body>
</html>
